<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rubik Cube</title>f
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    cursor: grab;
  }
  body.dragging { cursor: grabbing; }
  canvas { display: block; }

  #shuffleBtn {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: none;
    border: none;
    color: #888;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    padding: 12px 20px;
    cursor: pointer;
    opacity: 0;
    transition: color 0.25s ease, opacity 0.6s ease, letter-spacing 0.3s ease;
    user-select: none;
    z-index: 10;
  }
  #shuffleBtn.visible { opacity: 1; }
  #shuffleBtn:hover {
    color: #fff;
    letter-spacing: 0.45em;
  }
  #shuffleBtn:active { color: #ccc; }
</style>
</head>
<body>

<button id="shuffleBtn">Shuffle</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(2.8, 2.6, 3.6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.85));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
keyLight.position.set(3, 4, 5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.25);
fillLight.position.set(-3, -2, -3);
scene.add(fillLight);

const MAT = {
  white:   new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.55, metalness: 0.0, flatShading: true }),
  yellow:  new THREE.MeshStandardMaterial({ color: 0xffd500, roughness: 0.55, metalness: 0.0, flatShading: true }),
  green:   new THREE.MeshStandardMaterial({ color: 0x009b48, roughness: 0.55, metalness: 0.0, flatShading: true }),
  blue:    new THREE.MeshStandardMaterial({ color: 0x0046ad, roughness: 0.55, metalness: 0.0, flatShading: true }),
  red:     new THREE.MeshStandardMaterial({ color: 0xb71234, roughness: 0.55, metalness: 0.0, flatShading: true }),
  orange:  new THREE.MeshStandardMaterial({ color: 0xff5800, roughness: 0.55, metalness: 0.0, flatShading: true }),
  black:   new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.55, metalness: 0.0, flatShading: true })
};

const TOTAL = 0.9;
const CELL = TOTAL / 3;
const CUBE_GEO = new THREE.BoxGeometry(CELL, CELL, CELL);

const root = new THREE.Group();
scene.add(root);

const cubies = [];

for (let x = -1; x <= 1; x++) {
  for (let y = -1; y <= 1; y++) {
    for (let z = -1; z <= 1; z++) {

      const px = (x ===  1) ? MAT.red    : MAT.black;
      const nx = (x === -1) ? MAT.orange : MAT.black;
      const py = (y ===  1) ? MAT.white  : MAT.black;
      const ny = (y === -1) ? MAT.yellow : MAT.black;
      const pz = (z ===  1) ? MAT.green  : MAT.black;
      const nz = (z === -1) ? MAT.blue   : MAT.black;

      const mesh = new THREE.Mesh(CUBE_GEO, [px, nx, py, ny, pz, nz]);
      mesh.userData.basePos = new THREE.Vector3(x, y, z);
      mesh.userData.rot = new THREE.Quaternion();
      root.add(mesh);
      cubies.push(mesh);
    }
  }
}

function applyTransforms() {
  for (const c of cubies) {
    const p = c.userData.basePos;
    c.position.set(p.x * CELL, p.y * CELL, p.z * CELL);
    c.quaternion.copy(c.userData.rot);
  }
}
applyTransforms();

function rotateLayerInstant(axis, layer, dir) {
  const angle = Math.PI / 2 * dir;
  const axisVec = new THREE.Vector3(
    axis === 'x' ? 1 : 0,
    axis === 'y' ? 1 : 0,
    axis === 'z' ? 1 : 0
  );
  const q = new THREE.Quaternion().setFromAxisAngle(axisVec, angle);

  for (const c of cubies) {
    const p = c.userData.basePos;
    if (Math.round(p[axis]) !== layer) continue;

    const np = p.clone().applyQuaternion(q);
    np.set(Math.round(np.x), Math.round(np.y), Math.round(np.z));
    c.userData.basePos.copy(np);
    c.userData.rot.premultiply(q);
  }
  applyTransforms();
}

const CHECKERBOARD = [
  ['x',  1,  1], ['x',  1,  1],
  ['x', -1, -1], ['x', -1, -1],
  ['y',  1,  1], ['y',  1,  1],
  ['y', -1, -1], ['y', -1, -1],
  ['z',  1,  1], ['z',  1,  1],
  ['z', -1, -1], ['z', -1, -1]
];

for (const [a, l, d] of CHECKERBOARD) {
  rotateLayerInstant(a, l, d);
}

const INTRO_SEQUENCE = CHECKERBOARD.slice().reverse().map(([a, l, d]) => [a, l, -d]);

let introDelay = 0.8;
let introIndex = 0;
let introFinished = false;

let autoAnim = null;

function startAutoRotation(axis, layer, dir, duration) {
  const axisVec = new THREE.Vector3(
    axis === 'x' ? 1 : 0,
    axis === 'y' ? 1 : 0,
    axis === 'z' ? 1 : 0
  );

  const state = [];
  for (const c of cubies) {
    if (Math.round(c.userData.basePos[axis]) !== layer) continue;
    state.push({
      cubie: c,
      startPos: c.userData.basePos.clone(),
      startRot: c.userData.rot.clone()
    });
  }

  autoAnim = { axis, layer, dir, axisVec, state, t: 0, duration };
}

function updateAutoAnim(dt) {
  if (!autoAnim) return;

  autoAnim.t += dt / autoAnim.duration;
  const p = Math.min(autoAnim.t, 1);
  const eased = 1 - Math.pow(1 - p, 3);
  const angle = (Math.PI / 2 * autoAnim.dir) * eased;
  const qPartial = new THREE.Quaternion().setFromAxisAngle(autoAnim.axisVec, angle);

  for (const s of autoAnim.state) {
    const pos = s.startPos.clone().applyQuaternion(qPartial);
    s.cubie.position.set(pos.x * CELL, pos.y * CELL, pos.z * CELL);
    s.cubie.quaternion.copy(qPartial.clone().multiply(s.startRot));
  }

  if (p >= 1) {
    const qFinal = new THREE.Quaternion().setFromAxisAngle(
      autoAnim.axisVec,
      Math.PI / 2 * autoAnim.dir
    );
    for (const s of autoAnim.state) {
      const np = s.startPos.clone().applyQuaternion(qFinal);
      np.set(Math.round(np.x), Math.round(np.y), Math.round(np.z));
      s.cubie.userData.basePos.copy(np);
      s.cubie.userData.rot.premultiply(qFinal);
    }
    applyTransforms();
    autoAnim = null;
  }
}

let snapAnim = null;

function updateSnap(dt) {
  if (!snapAnim) return;

  snapAnim.t += dt / snapAnim.duration;
  const p = Math.min(snapAnim.t, 1);
  const eased = 1 - Math.pow(1 - p, 3);

  const angle = snapAnim.startAngle + (snapAnim.targetAngle - snapAnim.startAngle) * eased;
  const q = new THREE.Quaternion().setFromAxisAngle(snapAnim.axisVec, angle);

  for (const s of snapAnim.state) {
    const pos = s.startPos.clone().applyQuaternion(q);
    s.cubie.position.set(pos.x * CELL, pos.y * CELL, pos.z * CELL);
    s.cubie.quaternion.copy(q.clone().multiply(s.startRot));
  }

  if (p >= 1) {
    const qFinal = new THREE.Quaternion().setFromAxisAngle(snapAnim.axisVec, snapAnim.targetAngle);
    for (const s of snapAnim.state) {
      const np = s.startPos.clone().applyQuaternion(qFinal);
      np.set(Math.round(np.x), Math.round(np.y), Math.round(np.z));
      s.cubie.userData.basePos.copy(np);
      s.cubie.userData.rot.premultiply(qFinal);
    }
    applyTransforms();
    snapAnim = null;
  }
}

const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();

function faceNormalLocal(faceIndex) {
  const i = Math.floor(faceIndex / 2);
  return [
    new THREE.Vector3( 1, 0, 0),
    new THREE.Vector3(-1, 0, 0),
    new THREE.Vector3( 0, 1, 0),
    new THREE.Vector3( 0,-1, 0),
    new THREE.Vector3( 0, 0, 1),
    new THREE.Vector3( 0, 0,-1)
  ][i];
}

const LAYER_ROT_LIMIT = Math.PI / 2;

let backgroundMode = false;
let bgStartX = 0, bgStartY = 0;
let globalRotX = 0, globalRotY = 0;
let globalRotXBefore = 0, globalRotYBefore = 0;

let drag = null;

renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  if (!introFinished) return;
  if (autoAnim) return;
  if (snapAnim) return;

  mouseNDC.x = (e.clientX / innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);

  const hits = raycaster.intersectObjects(cubies, false);

  if (hits.length > 0) {
    const h = hits[0];
    const cubie = h.object;
    const nLocal = faceNormalLocal(h.faceIndex);
    const nRoot = nLocal.clone().applyQuaternion(cubie.quaternion);

    const ax = Math.abs(nRoot.x), ay = Math.abs(nRoot.y), az = Math.abs(nRoot.z);
    let faceAxis;
    if (ax >= ay && ax >= az) faceAxis = 'x';
    else if (ay >= ax && ay >= az) faceAxis = 'y';
    else faceAxis = 'z';

    drag = {
      cubie,
      faceAxis,
      normalRoot: nRoot,
      startX: e.clientX,
      startY: e.clientY,
      decided: false,
      axis: null,
      layer: 0,
      axisVec: null,
      initialState: null,
      currentAngle: 0
    };
  } else {
    backgroundMode = true;
    bgStartX = e.clientX;
    bgStartY = e.clientY;
    globalRotXBefore = globalRotX;
    globalRotYBefore = globalRotY;
  }

  document.body.classList.add('dragging');
});

window.addEventListener('mousemove', (e) => {
  if (backgroundMode) {
    const dx = e.clientX - bgStartX;
    const dy = e.clientY - bgStartY;

    globalRotY = globalRotYBefore + dx * 0.008;
    globalRotX = globalRotXBefore + dy * 0.008;

    root.rotation.set(globalRotX, globalRotY, 0);
    return;
  }

  if (!drag) return;

  const dx = e.clientX - drag.startX;
  const dy = e.clientY - drag.startY;

  if (!drag.decided) {
    const dist = Math.hypot(dx, dy);
    if (dist < 8) return;

    const faceAxis = drag.faceAxis;
    const perpendicular = { x: ['y','z'], y: ['x','z'], z: ['x','y'] }[faceAxis];

    const facePointLocal = drag.cubie.position.clone()
      .add(drag.normalRoot.clone().multiplyScalar(CELL / 2));
    const facePointWorld = facePointLocal.clone().applyEuler(root.rotation);

    const dragVec = new THREE.Vector2(dx, dy).normalize();

    let best = null;
    let bestDot = 0;

    for (const axisRot of perpendicular) {
      const axisVec = new THREE.Vector3(
        axisRot === 'x' ? 1 : 0,
        axisRot === 'y' ? 1 : 0,
        axisRot === 'z' ? 1 : 0
      );

      const r = facePointLocal.clone();
      const tangent = new THREE.Vector3().crossVectors(axisVec, r);

      if (tangent.length() < 0.001) continue;
      tangent.normalize();

      const p0 = facePointWorld.clone().project(camera);
      const p1 = facePointLocal.clone()
        .add(tangent.clone().multiplyScalar(0.1))
        .applyEuler(root.rotation)
        .project(camera);

      const screenDir = new THREE.Vector2(p1.x - p0.x, -(p1.y - p0.y));
      if (screenDir.length() < 0.0001) continue;
      screenDir.normalize();

      const dot = screenDir.dot(dragVec);

      if (Math.abs(dot) > Math.abs(bestDot)) {
        bestDot = dot;
        best = { axis: axisRot, dir: dot > 0 ? 1 : -1 };
      }
    }

    if (best) {
      const axisRot = best.axis;
      const layer = Math.round(drag.cubie.userData.basePos[axisRot]);

      drag.axis = axisRot;
      drag.layer = layer;
      drag.axisVec = new THREE.Vector3(
        axisRot === 'x' ? 1 : 0,
        axisRot === 'y' ? 1 : 0,
        axisRot === 'z' ? 1 : 0
      );

      drag.initialState = [];
      for (const c of cubies) {
        if (Math.round(c.userData.basePos[axisRot]) === layer) {
          drag.initialState.push({
            cubie: c,
            startPos: c.userData.basePos.clone(),
            startRot: c.userData.rot.clone()
          });
        }
      }
      drag.decided = true;
    }
    return;
  }

  const facePointLocal = drag.cubie.position.clone()
    .add(drag.normalRoot.clone().multiplyScalar(CELL / 2));
  const facePointWorld = facePointLocal.clone().applyEuler(root.rotation);

  const r = facePointLocal.clone();
  const tangent = new THREE.Vector3().crossVectors(drag.axisVec, r);
  if (tangent.length() > 0.001) tangent.normalize();

  const p0 = facePointWorld.clone().project(camera);
  const p1 = facePointLocal.clone()
    .add(tangent.clone().multiplyScalar(0.1))
    .applyEuler(root.rotation)
    .project(camera);

  const screenDir = new THREE.Vector2(p1.x - p0.x, -(p1.y - p0.y)).normalize();

  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  const isVertical = absDy > absDx;

  const projection = dx * screenDir.x + dy * screenDir.y;
  const sensitivity = isVertical ? 0.007 : 0.009;

  let angle = projection * sensitivity;

  if (angle > LAYER_ROT_LIMIT) angle = LAYER_ROT_LIMIT;
  if (angle < -LAYER_ROT_LIMIT) angle = -LAYER_ROT_LIMIT;

  drag.currentAngle = angle;

  const q = new THREE.Quaternion().setFromAxisAngle(drag.axisVec, drag.currentAngle);
  for (const s of drag.initialState) {
    const pos = s.startPos.clone().applyQuaternion(q);
    s.cubie.position.set(pos.x * CELL, pos.y * CELL, pos.z * CELL);
    s.cubie.quaternion.copy(q.clone().multiply(s.startRot));
  }
});

window.addEventListener('mouseup', (e) => {
  if (e.button !== 0) return;

  if (backgroundMode) {
    backgroundMode = false;
    document.body.classList.remove('dragging');
    return;
  }

  if (!drag) return;

  if (drag.decided) {
    let quarters = Math.round(drag.currentAngle / (Math.PI / 2));
    if (quarters > 1) quarters = 1;
    if (quarters < -1) quarters = -1;

    const targetAngle = quarters * (Math.PI / 2);

    const stateSnapshot = drag.initialState.map(s => ({
      cubie: s.cubie,
      startPos: s.startPos.clone(),
      startRot: s.startRot.clone()
    }));

    snapAnim = {
      axisVec: drag.axisVec.clone(),
      state: stateSnapshot,
      startAngle: drag.currentAngle,
      targetAngle,
      t: 0,
      duration: 0.22
    };
  }

  drag = null;
  document.body.classList.remove('dragging');
});

const shuffleBtn = document.getElementById('shuffleBtn');

function showShuffleButton() {
  shuffleBtn.classList.add('visible');
}

let shuffleQueue = [];

function randomMove() {
  const axes = ['x', 'y', 'z'];
  const layers = [-1, 1];
  const dirs = [1, -1];
  return [
    axes[Math.floor(Math.random() * 3)],
    layers[Math.floor(Math.random() * 2)],
    dirs[Math.floor(Math.random() * 2)]
  ];
}

function generateShuffle(n = 20) {
  const moves = [];
  let last = null;
  for (let i = 0; i < n; i++) {
    let m;
    do {
      m = randomMove();
    } while (last && m[0] === last[0] && m[1] === last[1]);
    moves.push(m);
    last = m;
  }
  return moves;
}

shuffleBtn.addEventListener('click', () => {
  if (!introFinished) return;
  if (autoAnim) return;
  if (snapAnim) return;
  if (drag) return;
  if (shuffleQueue.length > 0) return;
  shuffleQueue = generateShuffle(20);
});

let lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  updateAutoAnim(dt);
  updateSnap(dt);

  if (!introFinished) {
    if (introDelay > 0) {
      introDelay -= dt;
    } else if (!autoAnim && introIndex < INTRO_SEQUENCE.length) {
      const [a, l, d] = INTRO_SEQUENCE[introIndex++];
      startAutoRotation(a, l, d, 0.14);
    } else if (!autoAnim && introIndex >= INTRO_SEQUENCE.length) {
      introFinished = true;
      showShuffleButton();
    }
  }

  if (introFinished && shuffleQueue.length > 0 && !autoAnim && !snapAnim && !drag) {
    const [a, l, d] = shuffleQueue.shift();
    startAutoRotation(a, l, d, 0.12);
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
